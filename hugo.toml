# Ninja Air Fry Recipes: Hugo site config. Theme: themes/hugo-breeze-plasma-inspired-theme (vendored copy, the same
# theme and settings as danielsada.tech so both sites look and navigate alike; see README.md).
# Requires Hugo >= 0.158 (built and deployed with 0.170.1). Deployed by Cloudflare Pages (README.md > Deploy).
baseURL = "https://ninja.danielsada.tech/"
title = "Ninja Air Fry Recipes"
theme = "hugo-breeze-plasma-inspired-theme"
locale = "en-US"
defaultContentLanguage = "en"
# No posts here: without this Hugo picks the root pages as the main section and the theme renders them as blog posts.
mainSections = ["none"]
enableRobotsTXT = true
# A reference site, not a blog: no posts, feeds or taxonomies.
disableKinds = ["taxonomy", "term", "rss"]

[minify]
  minifyOutput = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

[params]
  description = "Ninja air fryer cook times. Ninja Speedi cook charts and Speedi Meal builder, Ninja Double Stack times for one drawer, both drawers or stacked, and Ninja Foodi DualZone and Air Fryer charts."
  tagline = "Speedi, Double Stack, DualZone & Air Fryer cook times"
  logo = "images/DanielSadaLogo.png"
  favicon = "favicon.ico"   # no leading slash: relative to baseURL, which may be a sub-path
  ogimage = "images/og.png"   # 1200x630 social card (assets/images/og.png)
  crumbroot = "Ninja Air Fry Recipes"
  colorscheme = "auto"
  homeurl = "https://danielsada.tech/"   # the panel logo links back to the blog (theme param)
  repo = "https://github.com/danielsada/ninja-airfry-recipes"
  [params.author]
    name = "Daniel Sada"
    email = "hello@danielsada.tech"
    emaillabel = "hello [at] danielsada.tech"
    page = "/about"

  # Same colours as danielsada.tech (logo purple).
  [params.colors]
    wall = "#3d6fd6"
    [params.colors.light]
      accent = "#8a5cd6"
      ink = "#5e2ca5"
    [params.colors.dark]
      accent = "#a77bff"
      ink = "#c6a8ff"

  [params.panel]
    width = "17rem"
  # This site's own panel sections below Places, in order: the guide itself (menus.project: home, about), then one per
  # appliance (menus.speedi, menus.doublestack). Rendered by layouts/_partials/breeze/panel-projects.html.
  [[params.panel.sections]]
    menu = "project"
    title = "Ninja Air Fry Recipes"
  [[params.panel.sections]]
    menu = "speedi"
    title = "Ninja Speedi"
  [[params.panel.sections]]
    menu = "doublestack"
    title = "Ninja Double Stack"
  [[params.panel.sections]]
    menu = "dualzone"
    title = "Ninja Foodi DualZone"
  [[params.panel.sections]]
    menu = "airfryer"
    title = "Ninja Air Fryer"

  [params.rss]
    panel = false

  # The appliances this guide covers: the home page chooser (layouts/_partials/home/chooser.html).
  [[params.appliances]]
    name = "Ninja Speedi"
    page = "/speedi"
    svg = "speedi/appliances/speedi.svg"
    [[params.appliances.links]]
      text = "Cook times"
      ref = "/speedi"
    [[params.appliances.links]]
      text = "Speedi Meal builder"
      ref = "/speedi-meal-builder"
  [[params.appliances]]
    name = "Ninja Double Stack"
    page = "/double-stack"
    svg = "speedi/appliances/doublestack.svg"
    [[params.appliances.links]]
      text = "Cook times"
      ref = "/double-stack"
    [[params.appliances.links]]
      text = "Two layers in one drawer"
      ref = "/double-stack"
      anchor = "stacked"

  [[params.appliances]]
    name = "Ninja Foodi DualZone"
    page = "/foodi-dualzone"
    svg = "speedi/appliances/dualzone.svg"
    [[params.appliances.links]]
      text = "Cook times"
      ref = "/foodi-dualzone"
  [[params.appliances]]
    name = "Ninja Air Fryer"
    page = "/air-fryer"
    svg = "speedi/appliances/airfryer.svg"
    [[params.appliances.links]]
      text = "Cook times"
      ref = "/air-fryer"

  [params.home]
    [[params.home.main]]
      widget = "intro"
    [[params.home.main]]
      widget = "chooser"
      title = "Which Ninja do you have?"
    [[params.home.main]]
      widget = "modes"
      title = "Ninja Speedi cook times"
      page = "/speedi"
      data = "speedi"
    [[params.home.main]]
      widget = "modes"
      title = "Ninja Double Stack cook times"
      page = "/double-stack"
      data = "doublestack"
    [[params.home.main]]
      widget = "modes"
      title = "Ninja Foodi DualZone cook times"
      page = "/foodi-dualzone"
      data = "dualzone"
    [[params.home.main]]
      widget = "modes"
      title = "Ninja Air Fryer cook times"
      page = "/air-fryer"
      data = "airfryer"
    [[params.home.side]]
      widget = "builder"
      title = "Speedi Meal builder"
    [[params.home.side]]
      widget = "mainsite"
      title = "From danielsada.tech"

