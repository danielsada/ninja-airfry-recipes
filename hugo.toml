# Ninja Air Fry Recipes: Hugo site config. Theme: themes/hugo-breeze-plasma-inspired-theme (vendored copy, the same
# theme and settings as danielsada.tech so both sites look and navigate alike; see README.md).
# Requires Hugo >= 0.158 (built and deployed with 0.170.1).
baseURL = "https://danielsada.github.io/ninja-airfry-recipes/"
title = "Ninja Air Fry Recipes"
theme = "hugo-breeze-plasma-inspired-theme"
locale = "en-US"
defaultContentLanguage = "en"
# No posts here: without this Hugo picks the root pages as the main section and the theme renders them as blog posts.
mainSections = ["none"]
enableRobotsTXT = true
# A reference site, not a blog: no posts, feeds or taxonomies.
disableKinds = ["taxonomy", "term", "rss"]

[minify]
  minifyOutput = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

[params]
  description = "Ninja air fryer cook times and temperatures. Ninja Speedi cook charts and Speedi Meal builder, and Ninja Double Stack times for one or both baskets."
  tagline = "Speedi & Double Stack cook times"
  logo = "images/DanielSadaLogo.png"
  favicon = "favicon.ico"   # no leading slash: relative to baseURL, which may be a sub-path
  ogimage = "images/og.png"   # 1200x630 social card (assets/images/og.png)
  crumbroot = "Ninja Air Fry Recipes"
  colorscheme = "auto"
  # The main site; linked from Places and the About page.
  mainsite = "https://danielsada.tech/"
  repo = "https://github.com/danielsada/ninja-airfry-recipes"
  [params.author]
    name = "Daniel Sada"
    email = "hello@danielsada.tech"
    emaillabel = "hello [at] danielsada.tech"
    page = "/about"

  # Same colours as danielsada.tech (logo purple).
  [params.colors]
    wall = "#3d6fd6"
    [params.colors.light]
      accent = "#8a5cd6"
      ink = "#5e2ca5"
    [params.colors.dark]
      accent = "#a77bff"
      ink = "#c6a8ff"

  [params.panel]
    width = "17rem"
  # This site's own panel sections, below Places, in this order: one per appliance (menus.speedi, menus.doublestack),
  # then menus.guide without a title (layouts/_partials/breeze/panel-projects.html).
  [[params.panel.sections]]
    menu = "speedi"
    title = "Ninja Speedi"
  [[params.panel.sections]]
    menu = "doublestack"
    title = "Ninja Double Stack"
  [[params.panel.sections]]
    menu = "guide"

  [params.rss]
    panel = false

  [params.home]
    [[params.home.main]]
      widget = "intro"
    [[params.home.main]]
      widget = "modes"
      title = "Ninja Speedi cook times"
      page = "/speedi"
      data = "speedi"
    [[params.home.main]]
      widget = "modes"
      title = "Ninja Double Stack cook times"
      page = "/double-stack"
      data = "doublestack"
    [[params.home.side]]
      widget = "builder"
      title = "Speedi Meal builder"
    [[params.home.side]]
      widget = "mainsite"
      title = "From danielsada.tech"

[menus]
  # Places: the same entries as danielsada.tech (absolute links), so both sites share one navigation.
  [[menus.main]]
    name = "All posts"
    url = "https://danielsada.tech/posts/"
    weight = 10
    [menus.main.params]
      icon = "blog"
  [[menus.main]]
    name = "Notas"
    url = "https://danielsada.tech/notas/"
    weight = 20
    [menus.main.params]
      icon = "notas"
      badge = "ES"
      lang = "es"
  [[menus.main]]
    name = "Projects"
    url = "https://danielsada.tech/projects/"
    weight = 30
    [menus.main.params]
      icon = "apps"
  [[menus.main]]
    name = "About"
    url = "https://danielsada.tech/about/"
    weight = 40
    [menus.main.params]
      icon = "user"
  [[menus.main]]
    name = "Contact"
    url = "mailto:hello@danielsada.tech"
    weight = 50
    [menus.main.params]
      icon = "mail"

  # This site's own pages, one panel section per appliance (see params.panel.sections). Links with a #fragment jump to
  # a function on the chart page.
  [[menus.speedi]]
    name = "Cook times"
    pageRef = "/speedi"
    weight = 10
    [menus.speedi.params]
      icon = "chart"
  [[menus.speedi]]
    name = "Speedi Meal builder"
    pageRef = "/speedi-meal-builder"
    weight = 20
    [menus.speedi.params]
      icon = "pot"
  [[menus.speedi]]
    name = "Steam & Crisp"
    url = "/speedi/#steam-crisp"
    weight = 30
    [menus.speedi.params]
      icon = "steam"

  [[menus.doublestack]]
    name = "Cook times"
    pageRef = "/double-stack"
    weight = 10
    [menus.doublestack.params]
      icon = "chart"
  [[menus.doublestack]]
    name = "Stacked meals"
    url = "/double-stack/#stacked"
    weight = 20
    [menus.doublestack.params]
      icon = "stack"
  [[menus.doublestack]]
    name = "Air Fry"
    url = "/double-stack/#air-fry"
    weight = 30
    [menus.doublestack.params]
      icon = "fan"

  [[menus.guide]]
    name = "About this guide"
    pageRef = "/about"
    weight = 10
    [menus.guide.params]
      icon = "info"
  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/danielsada"
    weight = 10
    [menus.social.params]
      icon = "github"
  [[menus.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/danielsadac"
    weight = 20
    [menus.social.params]
      icon = "linkedin"
  [[menus.social]]
    name = "X (Twitter)"
    url = "https://x.com/danielsadac"
    weight = 30
    [menus.social.params]
      icon = "x"
