# Checks that the site builds cleanly. Cloudflare Pages builds and deploys it (README.md > Deploy).
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.170.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --panicOnWarning

      # Every root-relative link must point at a page or file that was built.
      - name: Check internal links
        run: |
          missing=""
          for p in $(grep -rhoE '(href|src)="?/[^" >#?]*' public --include='*.html' | sed -E 's/^(href|src)="?//' | sort -u); do
            f="public${p}"
            [ -e "$f" ] || [ -e "${f%/}/index.html" ] || missing="$missing $p"
          done
          if [ -n "$missing" ]; then echo "Links to missing files:"; printf '%s\n' $missing; exit 1; fi