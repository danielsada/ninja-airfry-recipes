# Builds the site with Hugo and publishes it to GitHub Pages.
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo --minify --gc --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Served from a sub-path (/<repo>/) on GitHub Pages: every root-relative link must carry it.
      - name: Check links keep the base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "${BASE_PATH}" ]; then
            bad=$(grep -rhoE '(href|src)="/[^"]*"' public --include='*.html' \
                  | grep -vE "=\"${BASE_PATH}/" | sort -u || true)
            if [ -n "$bad" ]; then echo "Links missing ${BASE_PATH}:"; echo "$bad"; exit 1; fi
            twice=$(grep -rhoE "(href|src)=\"?${BASE_PATH}${BASE_PATH}/[^\" >]*" public --include='*.html' | sort -u || true)
            if [ -n "$twice" ]; then echo "Links with ${BASE_PATH} twice:"; echo "$twice"; exit 1; fi
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
